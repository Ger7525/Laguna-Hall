<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Materiais</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #1a2a3a;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .input-group input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
    }
    .btn-add {
      background-color: #2980b9;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-add:hover {
      background-color: #1c5980;
    }
    ul.lista-materiais {
      list-style: none;
      margin-bottom: 20px;
      min-height: 50px;
    }
    ul.lista-materiais li {
      background: #f9f9f9;
      border: 1px solid #eee;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-remove-item {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }
    .acoes-group {
      display: flex;
      gap: 10px;
    }
    .btn-whatsapp {
      flex: 2;
      background-color: #25d366;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
    }
    .btn-whatsapp:hover {
      background-color: #1eb954;
    }
    .btn-limpar {
      flex: 1;
      background-color: #7f8c8d;
      color: white;
      border: none;
      padding: 12px;
      font-size: 15px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-limpar:hover {
      background-color: #616e70;
    }
    .logo-gs {display: flex; justify-content: center;align-items: center;align-content: center;}
  </style>
</head>
<body>

<div class="container">
  <h1>Lista de Materiais</h1>

  <!-- CAMPO PARA ADICIONAR ITEM -->
  <div class="input-group">
    <input type="text" id="input-material" placeholder="Digite a descrição do material...">
    <button type="button" class="btn-add" onclick="adicionarItem()">Adicionar</button>
  </div>

  <!-- LISTA DE ITENS EXIBIDOS -->
  <ul id="lista-materiais" class="lista-materiais"></ul>

  <!-- BOTOES DE ACAO -->
  <div class="acoes-group">
    <button type="button" class="btn-whatsapp" onclick="enviarWhatsApp()">Enviar via WhatsApp</button>
    <button type="button" class="btn-limpar" onclick="limparLista()">Limpar Lista</button>
  </div>
  <figure class="logo-gs">
                <img src="imagem/logo-login-p.png" alt="">
  </figure>
</div>

<script>
  const STORAGE_KEY = 'lista_materiais_salva';
  const NUMERO_DESTINO = '5581993897114';

  // Carrega a lista salva assim que a página é aberta
  document.addEventListener('DOMContentLoaded', renderizarLista);

  function obterListaSalva() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  }

  function salvarLista(lista) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
  }

  function adicionarItem() {
    const input = document.getElementById('input-material');
    const valor = input.value.trim();

    if (valor === '') return;

    const lista = obterListaSalva();
    lista.push(valor);
    salvarLista(lista);

    input.value = '';
    renderizarLista();
  }

  function removerItem(index) {
    const lista = obterListaSalva();
    lista.splice(index, 1);
    salvarLista(lista);
    renderizarLista();
  }

  function renderizarLista() {
    const ul = document.getElementById('lista-materiais');
    ul.innerHTML = '';
    const lista = obterListaSalva();

    if (lista.length === 0) {
      ul.innerHTML = '<li style="color: #888; justify-content: center;">Nenhum item na lista.</li>';
      return;
    }

    lista.forEach((item, index) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${index + 1}. ${item}</span>`;

      const btnDel = document.createElement('button');
      btnDel.textContent = 'Remover';
      btnDel.className = 'btn-remove-item';
      btnDel.onclick = () => removerItem(index);

      li.appendChild(btnDel);
      ul.appendChild(li);
    });
  }

  function limparLista() {
    const lista = obterListaSalva();
    if (lista.length === 0) return;

    if (confirm('Deseja realmente apagar toda a lista de materiais?')) {
      localStorage.removeItem(STORAGE_KEY);
      renderizarLista();
    }
  }

  function enviarWhatsApp() {
    const lista = obterListaSalva();

    if (lista.length === 0) {
      alert('A lista está vazia! Adicione itens antes de enviar.');
      return;
    }

    let mensagem = '*Solicitação de Materiais:*\n\n';
    lista.forEach((item, index) => {
      mensagem += `${index + 1}. ${item}\n`;
    });

    const url = `https://api.whatsapp.com/send?phone=${NUMERO_DESTINO}&text=${encodeURIComponent(mensagem)}`;
    window.open(url, '_blank');
  }
</script>

</body>
</html>
