<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Portaria Laguna Hall</title>
    <link rel="stylesheet" href="estilo/style.css">
</head>
<body class="login-page">

    <div class="login-card">
        <h2>🏢 Acesso ao Sistema</h2>
        <form onsubmit="iniciarSessao(event)">
            <div class="form-group">
                <label for="selectUsuarioLogin">Colaborador:</label>
                <select id="selectUsuarioLogin" required>
                    <option value="">-- Selecione seu nome --</option>
                    <option value="Germano Santos">Germano Santos (Porteiro)</option>
                    <option value="Jonas Paulo">Jonas Paulo (Porteiro)</option>
                    <option value="Alexandre Florêncio">Alexandre Florêncio (Porteiro)</option>
                    <option value="Luiz Carlos">Luiz Carlos (Porteiro)</option>
                    <option value="Cícero">Cícero (Zelador)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
        <footer class="logo-gs">
          <img src="imagem/logo-azul-removebg-preview-removebg-preview.png" alt="">
        </footer>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
