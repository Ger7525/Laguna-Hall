<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="shortcut icon"
        href="imagens/favicon.ico"
        type="image/x-icon"
    >

    <link
        rel="stylesheet"
        href="estilo/style.css"
    >

    <title>
        Login - Edifício Laguna Hall
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }

        .login-overlay {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #eef5f1,
                    #dfeae5
                );

        }

        .login-card {

            width: 100%;

            max-width: 430px;

            background: #ffffff;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.15);

            text-align: center;

        }

        .login-logo {

            width: 130px;

            max-height: 100px;

            object-fit: contain;

            margin-bottom: 15px;

        }

        .login-card h1 {

            margin: 5px 0;

            color: #1f4d3b;

            font-size: 28px;

        }

        .login-card h2 {

            margin:
                0 0 10px;

            font-size: 18px;

            color: #444;

        }

        .login-card p {

            margin-bottom: 25px;

            color: #777;

            font-size: 14px;

        }

        .login-card label {

            display: block;

            text-align: left;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;

        }

        .login-card input {

            width: 100%;

            padding: 14px;

            border:
                1px solid #ccc;

            border-radius: 9px;

            font-size: 16px;

            outline: none;

            margin-bottom: 15px;

        }

        .login-card input:focus {

            border-color: #1f4d3b;

            box-shadow:
                0 0 0 3px
                rgba(31, 77, 59, 0.12);

        }

        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #1f4d3b;

            color: #ffffff;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        .login-button:hover {

            background: #163a2c;

        }

        .login-help {

            margin-top: 18px;

            font-size: 12px;

            color: #888;

            line-height: 1.5;

        }

        .login-footer {

            margin-top: 25px;

            font-size: 12px;

            color: #999;

        }

        .erro-login {

            display: none;

            margin-bottom: 15px;

            padding: 10px;

            border-radius: 7px;

            background: #ffe7e7;

            color: #b00020;

            font-size: 13px;

        }

    </style>

</head>


<body>


    <main class="login-overlay">


        <section class="login-card">


            <img
                src="imagens/logo.png"
                alt="Logo Edifício Laguna Hall"
                class="login-logo"
            >


            <h1>
                🏢 Laguna Hall
            </h1>


            <h2>
                Passagem de Plantão
            </h2>


            <p>
                Digite seu nome para iniciar o plantão.
            </p>


            <div
                id="erroLogin"
                class="erro-login"
            >
                Por favor, informe seu nome.
            </div>


            <form id="loginForm">


                <label for="nomeUsuario">

                    Nome do Porteiro

                </label>


                <input
                    type="text"
                    id="nomeUsuario"
                    name="nomeUsuario"
                    placeholder="Digite seu nome"
                    maxlength="80"
                    autocomplete="name"
                    required
                >


                <button
                    type="submit"
                    class="login-button"
                >

                    ENTRAR

                </button>


            </form>


            <div class="login-help">

                Ao entrar, seu nome será registrado
                automaticamente como o
                <strong>porteiro que está saindo</strong>.

                <br><br>

                O plantão será salvo automaticamente
                enquanto você estiver preenchendo.

            </div>


            <div class="login-footer">

                Ger Santos Desenvolvimento Web

            </div>


        </section>


    </main>


    <script src="js/app.js"></script>


</body>

</html>
